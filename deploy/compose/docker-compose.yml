# siltide as a headless collector, with Prometheus scraping it and Grafana
# already pointed at a dashboard over the metrics it exports.
#
#   docker compose -f deploy/compose/docker-compose.yml up
#   open http://localhost:3000   (anonymous, no login)
#
# The point of this file is that the next step after --listen is always the
# same: a scrape config and an evening of building panels. Both are here.
services:
  siltide:
    image: ghcr.io/moezdil/siltide:latest
    command: ["--service", "--listen", "0.0.0.0:9800"]
    # The devices, and the host's processes so a process can be named. Without
    # pid: host siltide sees only what is inside its own namespace, which on a
    # GPU node is nothing worth looking at.
    pid: host
    # Remove this on a machine with no NVIDIA driver; the other vendors are
    # read from /sys and need nothing here.
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    volumes:
      - siltide-state:/var/lib/siltide
    ports:
      - "9800:9800"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on: [siltide]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # A local dashboard, not an exposed one: anonymous access saves a login
      # nobody wants for a compose file on their own machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  siltide-state:
  prometheus-data:
  grafana-data:
