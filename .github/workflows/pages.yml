name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p _site/assets
          cp site/*.html site/styles.css site/site.js site/robots.txt _site/
          cp assets/logo.svg assets/demo.gif assets/demo.json assets/demo-light.json assets/og-home.png _site/assets/
          # The sitemap is generated from what was just copied, so a page that
          # is added or removed cannot leave it stale.
          python3 - <<'PY'
          import os, datetime
          base = "https://moezdil.github.io/siltide/"
          today = datetime.date.today().isoformat()
          pages = sorted(f for f in os.listdir("_site") if f.endswith(".html"))
          urls = []
          for f in pages:
              loc = base if f == "index.html" else base + f
              priority = "1.0" if f == "index.html" else "0.7"
              urls.append(f"  <url>\n    <loc>{loc}</loc>\n    <lastmod>{today}</lastmod>\n    <priority>{priority}</priority>\n  </url>")
          open("_site/sitemap.xml", "w").write(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              + "\n".join(urls) + "\n</urlset>\n")
          print(f"sitemap: {len(pages)} pages")
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
